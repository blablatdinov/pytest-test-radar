[project]
name = "pytest-test-radar"
version = "0.0.1-a9"
description = "A pytest plugin to send test statistics to Test Radar."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "tenacity>=9.1.4",
    "zstandard>=0.23.0",
]
keywords = ["pytest", "test", "plugin", "flaky"]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/yourusername/pytest-test-radar"

[project.entry-points.pytest11]
test_radar = "pytest_test_radar.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_test_radar"]

[tool.uv]
dev-dependencies = [
    "fastapi==0.115.6",
    "pytest==8.3.4",
]
